[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carriola-downloader"
version = "16.0.0.dev1"
description = "Carriola Vídeos Downloader — aplicativo desktop em desenvolvimento"
requires-python = ">=3.11"
dependencies = [
  "customtkinter>=5.2.2,<6",
  "Pillow>=10,<13",
  "yt-dlp[default]>=2026.8.19",
  "packaging>=24",
  "plyer>=2.1,<3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
build = ["pyinstaller>=6.11,<7"]

[project.gui-scripts]
carriola = "carriola_downloader.__main__:main"

[tool.setuptools.packages.find]
include = ["carriola_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
