name: Testes do aplicativo
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - name: Dependências de mídia e tela virtual (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: Testes de lógica, fila e arquivos reais
        run: python -m pytest -q tests/test_core.py tests/test_media_integration.py tests/test_services.py
      - name: Interface em tela virtual (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q tests/test_ui.py
      - name: Interface no Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_ui.py
